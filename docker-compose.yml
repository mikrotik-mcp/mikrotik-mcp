name: mikrotik-mcp

services:
  mikrotik-mcp:
    # Published multi-platform image; opt into another release explicitly.
    image: alimaster/mikrotik-mcp:${MIKROTIK_IMAGE_TAG:-5.19.0}
    container_name: mikrotik-mcp
    restart: unless-stopped
    command: ["serve"]
    # Optional explicit overrides. Leave MCP settings out of .env when JSON
    # should be authoritative across restarts.
    env_file:
      - path: .env
        required: false
    environment:
      MIKROTIK_CONFIG_FILE: /home/bun/.mikrotik-mcp/devices.json
      MIKROTIK_LOG_LEVEL: ${MIKROTIK_LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:${MCP_PORT:-8000}:${MCP_PORT:-8000}"
      - "127.0.0.1:${DASHBOARD_PORT:-9090}:${DASHBOARD_PORT:-9090}"
    volumes:
      - mikrotik-state:/home/bun/.mikrotik-mcp
      - type: bind
        source: ${MIKROTIK_CONFIG_PATH:-./devices.json}
        target: /home/bun/.mikrotik-mcp/devices.json
        read_only: false
        bind:
          create_host_path: false
    # Prefer key-based auth over a plaintext password. Drop your private key in
    # ./secrets/, uncomment below, and set the device's keyFilename in JSON to
    # /run/secrets/mikrotik_key:
    # Add under volumes above (key must be readable by container UID 1000):
    #   - ./secrets/mikrotik_ed25519:/run/secrets/mikrotik_key:ro
    # Inherit the image's Bun-based healthcheck; it respects the MCP port.

  # Optional: expose the server publicly over HTTPS for a ChatGPT Apps connector.
  # Create a Cloudflare named tunnel, put its token in CF_TUNNEL_TOKEN (.env),
  # and route it to http://mikrotik-mcp:8000. Run read-only until auth is in
  # place (MIKROTIK_READ_ONLY=true in .env).
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: mikrotik-mcp-tunnel
    profiles: ["chatgpt"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN:-}
    depends_on:
      - mikrotik-mcp

volumes:
  mikrotik-state:
