name: ci

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

# Least privilege: this workflow only reads the repo. Declared explicitly so it
# stays read-only regardless of the repo/org default token permissions.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run test:types

      - name: Test
        run: bun run test

      - name: Test Bun-native persistence
        run: bun run test:bun

      - name: Build
        run: bun run build

      # Schemas and website references are generated from source.
      # Fail if a tool changed but `bun run gen` wasn't re-run and committed.
      - name: Check generated artifacts are up to date
        run: |
          bun run gen
          git diff --exit-code -- schemas docs/content/docs/reference docs/content/docs/guides/config-schema.md docs/content/docs/guides/prompt-catalog.md \
            || (echo "::error::Generated files are stale. Run 'bun run gen' and commit the result." && exit 1)

  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: docs
      - run: bun run check:docs --complete && bun run types:check && bun run build
        working-directory: docs
